[package]
name = "nvmman"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
description = "An interactive TUI for maintaining nvm Node.js installations and global npm packages"
license = "MIT"
readme = "README.md"
repository = "https://github.com/handyutils/nvmman"
homepage = "https://github.com/handyutils/nvmman"
keywords = ["nodejs", "nvm", "npm", "tui", "ratatui"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
anyhow = "1.0"
crossterm = "0.29"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.15"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
